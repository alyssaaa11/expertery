[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "expertery"
version = "0.1.0"
description = "Expertery v0: installable private factory with an exam agent (CadQuery)"
requires-python = ">=3.12"
dependencies = ["modal"]

[project.scripts]
expertery = "expertery.cli:main"

[tool.setuptools]
packages = ["expertery"]
